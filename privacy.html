<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隐私政策</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="policy-header">
            <a href="index.html" class="back-button">← 返回首页</a>
            <h1>隐私政策</h1>
        </header>
        
        <main class="policy-content glass-effect">
            <section>
                <h2>1. 网络判断</h2>
                <p>当用户在网页端或者手机客户端上体验时，我们可能会判断您在使用平台时加载的宽带、wifi和数据流量等网络是否正常，以免体验时因为网络错误或者卡顿为你带来困扰！</p>
                
            </section>

            <section>
                <h2>2. 信息使用</h2>
                <p>我们承诺不会将您的个人信息用于任何未经您同意的用途。</p>
                
            </section>

            <section>
                <h2>3. 信息保护</h2>
                <p>我们采取合理的安全措施来保护您的个人信息不被未经授权的访问、披露、更改或销毁。</p>
                
            </section>
        </main>

        <footer class="policy-footer">
            <p style="font-weight: bold;">安全体验 © 2026-09-25 宣</p>
        </footer>
    </div>

    <script>
        // 主题切换功能
        const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');
        const currentTheme = localStorage.getItem('theme');
        
        if (currentTheme == 'dark') {
            document.body.classList.toggle('dark-theme');
        } else if (currentTheme == 'light') {
            document.body.classList.toggle('light-theme');
        }
    </script>
</body>
</html>
